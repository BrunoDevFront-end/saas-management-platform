name: Keep Supabase Active

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  keep-active:
    runs-on: ubuntu-latest

    steps:
      - name: Check database connection
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${API_URL}/health/db"
